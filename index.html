<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#090712">
<title>Gamer Bros</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<style>
:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#fff;background:#080611}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080611}button,a{font:inherit}.screen{position:fixed;inset:0;display:grid;grid-template-rows:auto 1fr auto;background:radial-gradient(circle at 50% 22%,#3b215f 0,#171021 40%,#080611 78%);isolation:isolate}.screen:before{content:"";position:absolute;inset:0;z-index:-2;background:linear-gradient(180deg,rgba(8,6,17,.20),rgba(8,6,17,.78)),url('./assets/gamer-bros-hero-menu.jpg') center 24%/cover no-repeat;opacity:.34;filter:saturate(1.12)}.screen:after{content:"";position:absolute;inset:0;z-index:-1;background:radial-gradient(circle at 50% 42%,transparent 0 24%,rgba(7,5,13,.30) 58%,rgba(7,5,13,.84) 100%);pointer-events:none}.brand{padding:max(18px,env(safe-area-inset-top)) 18px 0;text-align:center;pointer-events:none}.eyebrow{font-size:10px;font-weight:900;letter-spacing:.22em;color:#bfefff;text-transform:uppercase}.brand h1{margin:5px 0 0;font-size:clamp(40px,11vw,76px);line-height:.88;letter-spacing:-.055em;text-shadow:0 10px 34px rgba(0,0,0,.55)}.brand p{margin:8px 0 0;color:#d0c6dd;font-size:12px}.selector{min-height:0;display:grid;grid-template-rows:minmax(0,1fr) auto;align-items:center;width:min(920px,100%);margin:auto;padding:8px 14px 0}.preview{position:relative;min-height:0;height:100%;max-height:55vh;display:grid;place-items:center}.preview canvas{width:100%;height:100%;display:block;touch-action:none}.loading{position:absolute;inset:auto 0 14px;text-align:center;font-size:10px;letter-spacing:.12em;color:#a9a3b9;text-transform:uppercase;pointer-events:none}.characterMeta{position:absolute;left:50%;bottom:6px;transform:translateX(-50%);width:min(460px,88vw);text-align:center;pointer-events:none;text-shadow:0 2px 12px #000}.characterMeta strong{display:block;font-size:clamp(22px,6vw,36px);line-height:1}.characterMeta span{display:block;margin-top:5px;color:#c8bed4;font-size:11px}.rail{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:8px 2px 4px;overscroll-behavior-x:contain}.rail::-webkit-scrollbar{display:none}.charBtn{flex:0 0 auto;min-width:92px;min-height:54px;padding:8px 11px;border:1px solid rgba(220,204,255,.18);border-radius:15px;background:linear-gradient(180deg,rgba(33,24,48,.90),rgba(12,10,20,.94));color:#ddd7e7;text-align:left;box-shadow:0 10px 28px rgba(0,0,0,.20)}.charBtn b{display:block;font-size:12px;line-height:1.1}.charBtn small{display:block;margin-top:4px;font-size:8px;letter-spacing:.08em;color:#9e96ad;text-transform:uppercase}.charBtn.active{border-color:var(--accent,#72ddff);box-shadow:0 0 0 1px color-mix(in srgb,var(--accent,#72ddff) 40%,transparent) inset,0 0 24px color-mix(in srgb,var(--accent,#72ddff) 20%,transparent);color:#fff}.footer{width:min(720px,100%);margin:auto;padding:10px 16px max(16px,env(safe-area-inset-bottom));display:grid;gap:9px}.play{width:100%;min-height:56px;border:1px solid rgba(181,238,255,.42);border-radius:18px;background:linear-gradient(180deg,rgba(73,195,219,.96),rgba(27,116,158,.98));color:#fff;font-weight:950;letter-spacing:.08em;box-shadow:0 12px 34px rgba(0,0,0,.32),0 0 34px rgba(79,216,255,.16)}.play:active{transform:scale(.99)}.footnote{text-align:center;color:#9f98ad;font-size:9px;letter-spacing:.055em}.fail{display:none;position:fixed;inset:0;z-index:20;place-items:center;padding:20px;background:#080611}.fail.show{display:grid}.failCard{max-width:440px;padding:24px;border:1px solid #4e405f;border-radius:20px;background:#120e1c;text-align:center}.failCard a{color:#8fe7ff}@media(max-height:700px){.brand{padding-top:max(10px,env(safe-area-inset-top))}.brand h1{font-size:38px}.brand p{display:none}.preview{max-height:47vh}.footer{padding-top:5px}.play{min-height:48px}}@media(min-width:760px){.selector{grid-template-columns:minmax(0,1fr) 220px;grid-template-rows:1fr;gap:18px}.rail{height:min(460px,55vh);flex-direction:column;overflow-y:auto;overflow-x:hidden}.charBtn{width:100%}.preview{max-height:64vh}.footer{padding-bottom:max(24px,env(safe-area-inset-bottom))}}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.min.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"}}</script>
</head>
<body>
<main class="screen">
  <header class="brand"><div class="eyebrow">Happy Dude · Gamer Bros</div><h1>GAMER BROS</h1><p>Choose your character.</p></header>
  <section class="selector">
    <div class="preview" id="preview"><canvas id="previewCanvas"></canvas><div class="loading" id="loading">Loading character…</div><div class="characterMeta"><strong id="characterName">Gamer Bro</strong><span id="characterPower">Prismatic Burst</span></div></div>
    <div class="rail" id="characterRail" aria-label="Character selector"></div>
  </section>
  <footer class="footer"><button class="play" id="playBtn">PLAY TESTING GROUND</button><div class="footnote">One world for now · level select comes when there is a second level.</div></footer>
</main>
<div class="fail" id="fail"><div class="failCard"><h2>Character preview could not load</h2><p id="failText"></p><p><a href="./pass1-v1/">Open testing ground anyway</a></p></div></div>
<script type="module">
import * as THREE from 'three';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';

const CHARACTERS = [
  {id:'hero',name:'Gamer Bro',power:'Prismatic Burst',accent:'#65ddff',file:'./pass1-v1/assets/recovered/characters/hero.glb'},
  {id:'sprite_hero',name:'Citrus',power:'Multicolour Star Burst',accent:'#ff9a3d',file:'./pass1-v1/assets/recovered/characters/sprite_hero.glb'},
  {id:'ghost',name:'Ghost',power:'Spectral Phase Wave',accent:'#b782ff',file:'./pass1-v1/assets/recovered/characters/ghost.glb'},
  {id:'stump',name:'Stump',power:'Root Shockwave',accent:'#92d56d',file:'./pass1-v1/assets/recovered/characters/stump.glb'},
  {id:'cthulhu',name:'Cthulhu',power:'Void Orb',accent:'#a66cff',file:'./pass1-v1/assets/recovered/characters/cthulhu.glb'},
  {id:'yeti',name:'Yeti',power:'Frost Burst',accent:'#bcefff',file:'./pass1-v1/assets/recovered/characters/yeti.glb'}
];

const canvas=document.getElementById('previewCanvas');
const preview=document.getElementById('preview');
const rail=document.getElementById('characterRail');
const nameEl=document.getElementById('characterName');
const powerEl=document.getElementById('characterPower');
const loading=document.getElementById('loading');
const playBtn=document.getElementById('playBtn');
const fail=document.getElementById('fail');
const failText=document.getElementById('failText');

const renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio||1,1.75));
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.12;
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(35,1,.05,100);
camera.position.set(0,1.75,6.4);
scene.add(new THREE.HemisphereLight(0xdaf4ff,0x2e153c,2.1));
const key=new THREE.DirectionalLight(0xffffff,3.2);key.position.set(4,7,5);scene.add(key);
const rim=new THREE.DirectionalLight(0xb16dff,2.2);rim.position.set(-5,3,-4);scene.add(rim);
const floor=new THREE.Mesh(new THREE.CircleGeometry(2.1,64),new THREE.MeshStandardMaterial({color:0x191123,roughness:.56,metalness:.18,transparent:true,opacity:.75}));floor.rotation.x=-Math.PI/2;floor.position.y=-.02;scene.add(floor);
const ring=new THREE.Mesh(new THREE.TorusGeometry(1.55,.018,10,96),new THREE.MeshBasicMaterial({color:0x78e6ff,transparent:true,opacity:.5}));ring.rotation.x=Math.PI/2;ring.position.y=.01;scene.add(ring);

const loader=new GLTFLoader();
const cache=new Map();
let current=null,currentId=null,loadToken=0,baseY=0,dragging=false,lastX=0,userYaw=0;

function buildRail(){
  for(const c of CHARACTERS){
    const b=document.createElement('button');
    b.className='charBtn';b.dataset.id=c.id;b.style.setProperty('--accent',c.accent);
    b.innerHTML=`<b>${c.name}</b><small>${c.power}</small>`;
    b.addEventListener('click',()=>selectCharacter(c.id));
    rail.appendChild(b);
  }
}

function fitModel(root){
  root.updateMatrixWorld(true);
  const box=new THREE.Box3().setFromObject(root);
  const size=box.getSize(new THREE.Vector3());
  const center=box.getCenter(new THREE.Vector3());
  const scale=3.0/Math.max(size.y,.001);
  root.scale.setScalar(scale);root.updateMatrixWorld(true);
  const box2=new THREE.Box3().setFromObject(root);
  const center2=box2.getCenter(new THREE.Vector3());
  root.position.x-=center2.x;
  root.position.z-=center2.z;
  root.position.y-=box2.min.y;
  root.updateMatrixWorld(true);
  root.userData.previewBaseY=root.position.y;
  return root;
}

async function loadCharacter(c){
  if(cache.has(c.id))return cache.get(c.id).clone(true);
  const gltf=await loader.loadAsync(c.file);
  const root=gltf.scene;
  root.traverse(o=>{if(o.isMesh){o.castShadow=false;o.receiveShadow=false;}});
  fitModel(root);
  cache.set(c.id,root);
  return root.clone(true);
}

async function selectCharacter(id){
  const c=CHARACTERS.find(x=>x.id===id)||CHARACTERS[0];
  currentId=c.id;localStorage.setItem('gamerBroCharacter',c.id);
  nameEl.textContent=c.name;powerEl.textContent=c.power;ring.material.color.set(c.accent);
  rail.querySelectorAll('.charBtn').forEach(b=>b.classList.toggle('active',b.dataset.id===c.id));
  loading.textContent='Loading character…';loading.style.opacity='1';
  const token=++loadToken;
  try{
    const root=await loadCharacter(c);
    if(token!==loadToken)return;
    if(current)scene.remove(current);
    current=root;scene.add(current);current.rotation.y=.22;userYaw=0;
    loading.style.opacity='0';
  }catch(err){
    console.error(err);loading.textContent='Preview unavailable — choose another character';
  }
}

function resize(){
  const r=preview.getBoundingClientRect();
  const w=Math.max(1,Math.floor(r.width)),h=Math.max(1,Math.floor(r.height));
  renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();
}
window.addEventListener('resize',resize,{passive:true});
new ResizeObserver(resize).observe(preview);resize();

canvas.addEventListener('pointerdown',e=>{dragging=true;lastX=e.clientX;canvas.setPointerCapture?.(e.pointerId);});
canvas.addEventListener('pointermove',e=>{if(!dragging)return;const dx=e.clientX-lastX;lastX=e.clientX;userYaw+=dx*.008;});
canvas.addEventListener('pointerup',()=>dragging=false);canvas.addEventListener('pointercancel',()=>dragging=false);

playBtn.addEventListener('click',()=>{const id=currentId||CHARACTERS[0].id;location.href=`./pass1-v1/?hero=${encodeURIComponent(id)}`;});

let last=performance.now();
function animate(now){
  requestAnimationFrame(animate);
  const dt=Math.min(.05,(now-last)/1000);last=now;
  if(current){current.rotation.y+=dragging?0:dt*.28;current.rotation.y+=userYaw;userYaw=0;current.position.y=(current.userData.previewBaseY||0)+Math.sin(now*.0018)*.035;}
  ring.rotation.z+=dt*.18;
  renderer.render(scene,camera);
}

try{buildRail();const saved=localStorage.getItem('gamerBroCharacter');selectCharacter(CHARACTERS.some(c=>c.id===saved)?saved:'hero');requestAnimationFrame(animate);}catch(err){console.error(err);failText.textContent=String(err?.message||err);fail.classList.add('show');}

</script>
</body>
</html>
