name: Apply Gamer Bros v0.8.9 player pass

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-v089-player-pass.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch open-world runtime and player page
        shell: python {0}
        run: |
          from pathlib import Path

          main = Path('src/main-v087.js')
          s = main.read_text()
          original = s

          s = s.replace("fetch(url, { cache: 'no-store' })", "fetch(url, { cache: 'force-cache' })")
          s = s.replace("player.yaw+=diff*Math.min(1,dt*5.8);", "player.yaw+=diff*Math.min(1,dt*8.5);")
          s = s.replace("(moveKeys.run?4.65:2.85)*THREE.MathUtils.smoothstep", "(moveKeys.run?6.35:3.75)*THREE.MathUtils.smoothstep")
          s = s.replace("followDistance=14.5,followYawOffset=0,followPitchOffset=0,recenterClock=0", "followDistance=13.4,followYawOffset=0,followPitchOffset=0,recenterClock=0")

          marker = "  // Camera: no joystick/camera feedback loop. While the stick is active the camera keeps its\n"
          expose = '''  rep("const scene=new THREE.Scene();",\n      "const scene=new THREE.Scene();window.__gamerScene=scene;window.__gamerRenderer=renderer;",\n      'expose scene and renderer');\n  rep("const camera=new THREE.PerspectiveCamera(36,1,.15,125);",\n      "const camera=new THREE.PerspectiveCamera(36,1,.15,125);window.__gamerCamera=camera;",\n      'expose camera');\n\n'''
          if expose not in s:
              if marker not in s:
                  raise SystemExit('camera marker missing')
              s = s.replace(marker, expose + marker, 1)

          world_marker = '  const worldMarker = "    // Abyss cue only outside the room; quality stays in geometry/materials above it.";\n'
          crystal_patch = r'''  const camera87Pattern=/function applyCamera\(dt=\.016\)\{[\s\S]*?\}function selectView\(name\)/;
          if(camera87Pattern.test(source)){
            source=source.replace(camera87Pattern,"function applyCamera(dt=.016){if(window.__introTourActive&&window.__introPose){const q=window.__introPose;camera.position.set(q.pos[0],q.pos[1],q.pos[2]);target.set(q.look[0],q.look[1],q.look[2]);camera.lookAt(target);return;}if(cameraMode==='orbit'||heroPortalState!=='outside'){yaw+=(targetYaw-yaw)*.085;pitch+=(targetPitch-pitch)*.085;distance+=(targetDistance-distance)*.09;target.lerp(targetLook,.085);}else{targetLook.set(player.x,player.y+1.45,player.z);target.lerp(targetLook,1-Math.exp(-8*dt));if(dragging||window.__gamerInput?.active)recenterClock=0;else recenterClock+=dt;if(!dragging&&!window.__gamerInput?.active&&recenterClock>.85&&followLock){const behind=player.yaw+Math.PI,dy=Math.atan2(Math.sin(behind-yaw),Math.cos(behind-yaw));yaw+=dy*(1-Math.exp(-1.75*dt));pitch=THREE.MathUtils.damp(pitch,cameraMode==='tight'?.24:.34,2.5,dt);}distance=THREE.MathUtils.damp(distance,cameraMode==='tight'?7.6:followDistance,3.8,dt);}const cp=Math.cos(pitch);camera.position.set(target.x+Math.sin(yaw)*cp*distance,target.y+Math.sin(pitch)*distance+(cameraMode==='tight'?.55:1.05),target.z+Math.cos(yaw)*cp*distance);camera.lookAt(target);}function selectView(name)");
            patches.push('Crystal Library follow camera + cinematic hook');
          }else console.warn('[v0.8.9 patch miss] camera function');

          const pointer87Pattern=/renderer\.domElement\.addEventListener\('pointermove',e=>\{if\(!dragging\)return;const dx=e\.clientX-lastX,dy=e\.clientY-lastY;lastX=e\.clientX;lastY=e\.clientY;[\s\S]*?\}\);function pointerUp/;
          if(pointer87Pattern.test(source)){
            source=source.replace(pointer87Pattern,"renderer.domElement.addEventListener('pointermove',e=>{if(!dragging)return;const dx=e.clientX-lastX,dy=e.clientY-lastY;lastX=e.clientX;lastY=e.clientY;if(cameraMode==='orbit'){targetYaw-=dx*.0052;targetPitch=clamp(targetPitch+dy*.0039,-.24,.58);}else{yaw-=dx*.0052;pitch=clamp(pitch+dy*.0036,.08,.62);targetYaw=yaw;targetPitch=pitch;recenterClock=0;}});function pointerUp");
            patches.push('Crystal Library drag look');
          }

'''
          if 'Crystal Library follow camera + cinematic hook' not in s:
              if world_marker not in s:
                  raise SystemExit('world marker missing')
              s = s.replace(world_marker, crystal_patch + world_marker, 1)

          if s == original:
              raise SystemExit('main runtime received no changes')
          main.write_text(s)

          html = Path('legacy-main-v087.html')
          h = html.read_text()
          h = h.replace('Gamer Bros Portal World v0.8.8', 'Gamer Bros Portal World v0.8.9')
          h = h.replace('<title>Gamer Bros Portal World v0.8.9</title>', '<title>Gamer Bros Portal World v0.8.9</title>\n<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>')
          if './v089.css' not in h:
              h = h.replace('<link rel="stylesheet" href="./v085.css?v=088">', '<link rel="stylesheet" href="./v085.css?v=089">\n<link rel="stylesheet" href="./v089.css?v=089">')
          h = h.replace('<body>', '<body class="playerMode introTour">')
          h = h.replace('?v=088', '?v=089')
          h = h.replace('V0.8.8 SCENIC RECOVERY', 'V0.8.9 PLAYER RECOVERY')
          if 'player-v089.js' not in h:
              h = h.replace('</body>', '<script type="module" src="./src/player-v089.js?v=089"></script>\n</body>')
          html.write_text(h)
      - name: Syntax check
        run: |
          node --check src/main-v087.js
          node --check src/player-v089.js
          node --check src/v087.js
      - name: Commit player pass
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main-v087.js legacy-main-v087.html
          git diff --cached --quiet && exit 0
          git commit -m 'Ship v0.8.9 cinematic player experience'
          git push origin HEAD:main
