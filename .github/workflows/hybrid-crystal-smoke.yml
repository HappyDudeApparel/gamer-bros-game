name: Hybrid Crystal Library browser smoke

on:
  push:
    branches: [hybrid-v0.9]
    paths:
      - 'hybrid-v09/**'
      - '.github/workflows/hybrid-crystal-smoke.yml'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hybrid-v0.9
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax checks
        run: |
          node --check hybrid-v09/src/game.js
          node --check hybrid-v09/src/crystal-library-v2.js
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Real Chromium startup and asset smoke test
        run: |
          python3 -m http.server 8080 >/tmp/hybrid-server.log 2>&1 &
          sleep 2
          node <<'NODE'
          const { chromium } = require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({
              viewport:{width:390,height:844},
              userAgent:'Mozilla/5.0 (Linux; Android 14; Pixel 8) AppleWebKit/537.36 Chrome/138 Mobile Safari/537.36'
            });
            const pageErrors=[];
            const badConsole=[];
            const assetResponses=new Map();
            page.on('pageerror',e=>pageErrors.push(String(e)));
            page.on('console',m=>{if(m.type()==='error')badConsole.push(m.text());});
            page.on('response',r=>{
              const u=r.url();
              for(const n of ['gate.glb','stairs.glb','bookcaseOpen.glb','bookcaseClosedWide.glb','lampWall.glb']){
                if(u.includes(n)) assetResponses.set(n,r.status());
              }
            });
            await page.goto('http://127.0.0.1:8080/hybrid-v09/',{waitUntil:'domcontentloaded',timeout:45000});
            await page.waitForSelector('#stage canvas',{state:'visible',timeout:45000});
            await page.waitForSelector('#ui.show',{state:'attached',timeout:45000});
            await page.waitForFunction(()=>document.getElementById('boot')?.classList.contains('hidden'),null,{timeout:45000});
            const fatalVisible=await page.$eval('#fatal',el=>getComputedStyle(el).display!=='none');
            if(fatalVisible) throw new Error('Fatal startup panel is visible');
            const canvas=await page.$eval('#stage canvas',c=>({w:c.width,h:c.height,rect:c.getBoundingClientRect().toJSON()}));
            if(canvas.w<100||canvas.h<100) throw new Error('Renderer canvas is not initialized: '+JSON.stringify(canvas));
            await page.waitForTimeout(10000);
            const goodAssets=[...assetResponses.entries()].filter(([,s])=>s>=200&&s<300);
            if(goodAssets.length<4) throw new Error('Expected Kenney GLB assets did not load. Seen: '+JSON.stringify([...assetResponses.entries()]));
            await page.keyboard.down('w'); await page.waitForTimeout(900); await page.keyboard.up('w');
            await page.waitForTimeout(500);
            if(pageErrors.length) throw new Error('Page errors: '+pageErrors.join(' | '));
            const fatalText=await page.textContent('#fatalText');
            if(fatalText?.trim()) throw new Error('Fatal text populated: '+fatalText.trim());
            await page.screenshot({path:'hybrid-crystal-smoke.png',fullPage:true});
            console.log('Canvas:',canvas.w+'x'+canvas.h);
            console.log('Kenney assets:',JSON.stringify([...assetResponses.entries()]));
            console.log('Console errors observed:',badConsole.length);
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1);});
          NODE
      - name: Upload smoke screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hybrid-crystal-smoke
          path: hybrid-crystal-smoke.png
          if-no-files-found: ignore
