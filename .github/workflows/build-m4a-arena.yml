name: Build Hybrid M4A arena

on:
  push:
    branches: [hybrid-m4a-build]
    paths:
      - tools/build-m4a-arena.mjs
      - hybrid-v09/arena.layout.json
      - .github/workflows/build-m4a-arena.yml

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hybrid-m4a-build
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build arena into clean source
        run: node tools/build-m4a-arena.mjs
      - name: Syntax check
        run: node --check hybrid-v09/src/game.js
      - name: Validate arena data/source
        run: |
          node -e "JSON.parse(require('fs').readFileSync('hybrid-v09/arena.layout.json','utf8'))"
          grep -q "HybridM4AArena" hybrid-v09/src/game.js
          grep -q "arenaLayout.platforms.forEach" hybrid-v09/src/game.js
          grep -q "walkSurfaces.length=0" hybrid-v09/src/game.js
          grep -q "PerspectiveCamera(36,1,.15,125)" hybrid-v09/src/game.js
          ! grep -q "function plateau90" hybrid-v09/src/game.js
      - name: Commit M4A source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add hybrid-v09/src/game.js hybrid-v09/index.html
          git diff --cached --quiet && exit 0
          git commit -m "Build Hybrid v0.9 M4A vertical arena foundation"
          git push origin HEAD:hybrid-m4a-build

# one-time migration workflow; delete after successful source commit
