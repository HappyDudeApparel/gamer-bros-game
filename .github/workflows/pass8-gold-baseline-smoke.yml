name: Gamer Bros Pass 8 gold baseline smoke

on:
  push:
    branches: [main]
    paths:
      - 'pass8-v1/**'
      - 'src/crystal-library-tube-v2.js'
      - 'playground-v2/gamer-bro.js'
      - 'title-v2.js'
      - 'index.html'
      - '.github/workflows/pass8-gold-baseline-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax checks
        run: |
          node --check pass8-v1/app.js
          node --check src/crystal-library-tube-v2.js
          node --check title-v2.js
      - name: Install Playwright Chromium
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Authored arena movement and exact Crystal Library tube
        run: |
          python3 -m http.server 8080 >/tmp/server.log 2>&1 &
          sleep 2
          node <<'NODE'
          const {chromium}=require('playwright');
          const wait=(p,fn,t=60000)=>p.waitForFunction(fn,null,{timeout:t});
          const d=(a,b)=>Math.hypot(a.x-b.x,a.z-b.z);
          async function run(browser,viewport,isMobile){
            const page=await browser.newPage({viewport,hasTouch:isMobile,isMobile,userAgent:isMobile?'Mozilla/5.0 (Linux; Android 15; Pixel 8) AppleWebKit/537.36 Chrome/140 Mobile Safari/537.36':undefined});
            const errors=[];
            page.on('pageerror',e=>errors.push(String(e)));
            page.on('console',m=>{if(m.type()==='error'&&!m.text().includes('favicon'))errors.push(m.text())});
            await page.goto('http://127.0.0.1:8080/pass8-v1/?hero=gb2&smoke=1',{waitUntil:'domcontentloaded',timeout:60000});
            await wait(page,()=>window.__pass8Ready===true&&window.__authoredWorldOnly===true&&window.__enemyCount===0&&window.__fullGround===true,90000);
            await wait(page,()=>window.__crystalTubePrewarmed===true&&window.__tubeComponent==='crystal-library-v2-tube',60000);
            await wait(page,()=>document.getElementById('boot')?.classList.contains('hide'),15000);
            const sys=await page.evaluate(()=>({source:window.__worldSource,route:window.__worldRoute,enemies:window.__enemyCount,movement:window.__movementBaseline,camera:window.__cameraBaseline,tube:window.__tubeComponent,gated:window.__portalRequiresEnemies,ungated:window.__portalTestUngated}));
            if(sys.source!=='recovered-authored-concept-arena'||sys.enemies!==0||sys.movement!=='crystal-library-v2'||sys.camera!=='crystal-library-v2'||sys.tube!=='crystal-library-v2-tube'||sys.gated!==false||sys.ungated!==true)throw new Error('Gold baseline systems wrong '+JSON.stringify(sys));
            const start=await page.evaluate(()=>({x:window.__playerPosition.x,z:window.__playerPosition.z}));
            await page.keyboard.down('w');await page.waitForTimeout(1200);
            const motion=await page.evaluate(()=>window.__heroMotion);
            await page.keyboard.up('w');
            const end=await page.evaluate(()=>({x:window.__playerPosition.x,z:window.__playerPosition.z}));
            if(d(start,end)<.08)throw new Error('Movement input did not advance player '+JSON.stringify({start,end,motion}));
            if(!['walk','run','idle'].includes(motion))throw new Error('Motion state missing '+motion);
            await page.evaluate(()=>{const t=window.__tubePosition,p=window.__playerPosition;p.x=t.x;p.z=t.z;p.y=t.y+.02;p.vy=0;p.speed=0;p.grounded=true;});
            await wait(page,()=>['loading','charge','convert','sustain','dissipate','afterglow','complete'].includes(window.__tubeTransitionState),12000);
            await wait(page,()=>window.__tubeTransferComplete===true,60000);
            if(errors.length)throw new Error('Browser errors: '+errors.join(' | '));
            await page.close();
          }
          (async()=>{const browser=await chromium.launch({headless:true,args:['--enable-unsafe-swiftshader']});await run(browser,{width:1440,height:900},false);await run(browser,{width:390,height:844},true);await browser.close();console.log('Pass 8 gold baseline passed');})().catch(e=>{console.error(e);process.exit(1)});
          NODE