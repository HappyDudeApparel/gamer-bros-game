name: Build + Validate Pass 17B Concept Match
on:
  push:
    branches: [pass17-concept-match]
    paths:
      - 'src/pass17-asset-library.js'
      - 'src/pass17-riverworks-kit.js'
      - 'PASS17B_ASSET_MAP.md'
      - 'scripts/build_pass17a.py'
      - 'scripts/fix_pass17a_bridge.py'
      - 'scripts/fix_pass17a_clover.py'
      - 'scripts/build_pass17b.py'
      - 'scripts/patch_pass17_concept_hero.py'
      - 'scripts/test_pass17b_browser.py'
      - '.github/workflows/build-validate-pass17b.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build Pass 17A foundation then 17B landmarks
        run: |
          python scripts/build_pass17a.py
          python scripts/fix_pass17a_bridge.py
          python scripts/fix_pass17a_clover.py
          python scripts/build_pass17b.py
          python scripts/patch_pass17_concept_hero.py
      - name: Validate JavaScript
        run: |
          node --check pass17-world1/app.js
          node --check pass17-world1/world.js
          node --check pass17-world1/assets.js
          node --check pass17-world1/enemies.js
          node --check pass17-world1/power.js
          node --check src/pass17-riverworks-kit.js
          node --check src/pass17-concept-hero.js
          node --check src/pass17-gamer-bro.js
      - name: Validate concept-match markers
        run: |
          grep -q "riverworks-main-pipe" pass17-world1/world.js
          grep -q "dungeon:wall_arched.gltf.glb" pass17-world1/world.js
          grep -q "dungeon:chest_gold.glb" pass17-world1/world.js
          grep -q "prism-crystal-cluster" pass17-world1/world.js
          grep -q "__pass17ConceptLandmarksReady" pass17-world1/world.js
          grep -q "platformerBlue" pass17-world1/assets.js
          grep -q "pass17-gamer-bro.js" pass17-world1/index.html
      - name: Browser dependencies
        run: pip install selenium
      - name: Real desktop and Android concept smoke
        run: |
          python -m http.server 8000 >/tmp/pass17b-http.log 2>&1 &
          sleep 2
          python scripts/test_pass17b_browser.py
      - name: Commit generated Pass 17B
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pass17-world1
          if git diff --cached --quiet; then
            echo 'No generated changes'
          else
            git commit -m 'Build Pass 17B concept landmarks'
            git pull --rebase origin pass17-concept-match
            git push origin HEAD:pass17-concept-match
          fi
