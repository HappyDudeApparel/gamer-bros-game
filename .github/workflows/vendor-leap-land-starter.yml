name: Vendor Leap Land starter world

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/vendor-leap-land-starter.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  vendor:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install converter
        run: sudo apt-get update -qq && sudo apt-get install -y -qq assimp-utils unzip
      - name: Download starter and source palette from itch.io
        run: |
          set -euxo pipefail
          mkdir -p /tmp/leap
          python3 - <<'PY'
          import re, json, urllib.request
          def fetch_upload(base, out, prefer=None):
              def get(url,binary=False):
                  req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'})
                  data=urllib.request.urlopen(req,timeout=60).read()
                  return data if binary else data.decode('utf-8','ignore')
              def post(url):
                  req=urllib.request.Request(url,data=b'',headers={'User-Agent':'Mozilla/5.0','X-Requested-With':'XMLHttpRequest','Content-Type':'application/x-www-form-urlencoded'})
                  return urllib.request.urlopen(req,timeout=30).read().decode('utf-8','ignore')
              html=get(base)
              ids=re.findall(r'data-upload_id=["\'](\d+)',html)
              if not ids:
                  j=json.loads(post(base+'/download_url')); html=get(j['url']); ids=re.findall(r'data-upload_id=["\'](\d+)',html)
              if not ids: raise RuntimeError('No upload ids for '+base)
              for uid in ids:
                  try:
                      j=json.loads(post(base+f'/file/{uid}?source=view_game&as_props=1&after_download_lightbox=true')); url=j.get('url')
                      if not url: continue
                      data=get(url,True)
                      if len(data)<100000: continue
                      if prefer and prefer(data) is False: continue
                      open(out,'wb').write(data); print('downloaded',base,uid,len(data)); return
                  except Exception as e: print('candidate failed',uid,e)
              raise RuntimeError('No usable upload for '+base)
          fetch_upload('https://loxaevion.itch.io/upbge-0361-tutorial-starter-level','/tmp/leap/Tutorial Starter Level.fbx')
          fetch_upload('https://essssam.itch.io/3d-leap-land','/tmp/leap/source-pack.zip',lambda d:d[:2]==b'PK')
          PY
          unzip -q -o /tmp/leap/source-pack.zip -d /tmp/leap/source
          find /tmp/leap/source -type f | grep -Ei 'palette\.png$' | head -1 | xargs -I{} cp '{}' /tmp/leap/palette.png
          test -s /tmp/leap/palette.png
      - name: Convert starter world to browser GLB
        run: |
          set -euxo pipefail
          mkdir -p assets/vendor/leap-land
          assimp export '/tmp/leap/Tutorial Starter Level.fbx' assets/vendor/leap-land/tutorial-starter-level.glb -f glb2
          test -s assets/vendor/leap-land/tutorial-starter-level.glb
          cp '/tmp/leap/Tutorial Starter Level.fbx' assets/vendor/leap-land/tutorial-starter-level.fbx
          cp /tmp/leap/palette.png assets/vendor/leap-land/palette.png
          python3 - <<'PY'
          import json, struct
          path='assets/vendor/leap-land/tutorial-starter-level.glb'
          data=open(path,'rb').read()
          magic,version,total=struct.unpack_from('<4sII',data,0)
          if magic!=b'glTF' or version!=2: raise SystemExit('Unexpected GLB header')
          off=12; chunks=[]; changed=0
          while off < len(data):
              length,ctype=struct.unpack_from('<II',data,off); off+=8
              payload=data[off:off+length]; off+=length
              if ctype==0x4E4F534A:
                  doc=json.loads(payload.rstrip(b' \t\r\n\0').decode('utf-8'))
                  for image in doc.get('images',[]):
                      if 'uri' in image and image['uri']!='palette.png':
                          image['uri']='palette.png'; changed+=1
                  payload=json.dumps(doc,separators=(',',':')).encode('utf-8')
                  payload+=b' '*((4-len(payload)%4)%4)
              chunks.append((ctype,payload))
          rebuilt=b''.join(struct.pack('<II',len(payload),ctype)+payload for ctype,payload in chunks)
          out=struct.pack('<4sII',b'glTF',2,12+len(rebuilt))+rebuilt
          open(path,'wb').write(out)
          print('Patched GLB image URIs:',changed,'bytes:',len(out))
          if changed<1: raise SystemExit('No Leap Land image URI was patched')
          PY
          cat > assets/vendor/leap-land/LICENSE_AND_SOURCE.txt <<'EOF'
          3D Leap Land starter test world
          Starter scene: https://loxaevion.itch.io/upbge-0361-tutorial-starter-level
          Source asset pack: https://essssam.itch.io/3d-leap-land
          Original asset pack license: Creative Commons Zero 1.0 Universal (CC0).
          The starter-page author states the assembled test world is shared with permission from the asset creator.
          palette.png is preserved from Essssam's official source pack. The GLB image URI is normalized to palette.png for browser rendering.
          This repository preserves both the downloaded FBX and a browser-ready GLB conversion.
          EOF
          sha256sum assets/vendor/leap-land/tutorial-starter-level.* assets/vendor/leap-land/palette.png > assets/vendor/leap-land/SHA256SUMS.txt
      - name: Commit and retry push safely
        run: |
          set -euxo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/vendor/leap-land
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Fix Leap Land browser texture reference'
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push raced with main; retry $attempt/5"
            sleep $((attempt * 2))
          done
          echo 'Unable to push Leap Land assets after retries' >&2
          exit 1
