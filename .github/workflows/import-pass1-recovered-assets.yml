name: Import Pass 1 recovered assets

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-pass1-recovered-assets.yml'

permissions:
  contents: write

jobs:
  import-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download recovered asset package
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 --retry-delay 2 'https://sdmntprsouthcentralus.oaiusercontent.com/files/00000000-e4a0-81f7-b5ab-44039704010d/raw?se=2026-09-10T05%3A51%3A27Z&sp=r&sv=2026-02-06&sr=b&scid=da62e7dd-8e57-585b-a728-1fbb7857e41d&skoid=732f244e-db13-47c3-bcc7-7ee02a9397bc&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-10T01%3A46%3A20Z&ske=2026-09-11T01%3A46%3A20Z&sks=b&skv=2026-02-06&sig=9dkc6uI38Clg5SyCZT50NcEZG6J4VEqczFZEx/fHLUM%3D' -o /tmp/recovered.zip
          rm -rf /tmp/recovered
          mkdir -p /tmp/recovered
          unzip -q /tmp/recovered.zip -d /tmp/recovered
          mkdir -p pass1-v1/assets/recovered
          cp -R /tmp/recovered/. pass1-v1/assets/recovered/
          test -f pass1-v1/assets/recovered/characters/ghost.glb
          test -f pass1-v1/assets/recovered/characters/sprite_hero.glb
          test -f pass1-v1/assets/recovered/characters/stump.glb
          test -f pass1-v1/assets/recovered/characters/cthulhu.glb
          test -f pass1-v1/assets/recovered/characters/yeti.glb
      - name: Commit recovered binaries
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pass1-v1/assets/recovered
          git diff --cached --quiet && exit 0
          git commit -m 'Vendor recovered Pass 1 characters and arena assets'
          git push origin HEAD:main
