name: Validate Pass 18-0B Look Calibration

on:
  push:
    branches: [pass18-rebuild]
    paths:
      - 'src/pass18/**'
      - 'pass18-calibration/**'
      - 'data/pass18/cameras.json'
      - 'scripts/test_pass18_0b_look.py'
      - '.github/workflows/validate-pass18-0b-look.yml'
      - 'assets/world-kit/kenney/nature-kit/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pass18-0b-look-${{ github.ref }}
  cancel-in-progress: true

jobs:
  look-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout isolated Pass 18 branch
        uses: actions/checkout@v4

      - name: Verify authored modules and real asset inputs
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "pass18-rebuild"
          node --check src/pass18/world-language.js
          node --check src/pass18/calibration.js
          python -m py_compile scripts/test_pass18_0b_look.py
          python -m json.tool data/pass18/cameras.json >/dev/null
          test -f assets/world-kit/kenney/nature-kit/ground_pathBend.glb
          test -f assets/world-kit/kenney/nature-kit/ground_riverStraight.glb
          test -f assets/world-kit/kenney/nature-kit/ground_riverBend.glb
          test -f assets/world-kit/kenney/nature-kit/ground_grass.glb
          test -f assets/world-kit/kenney/nature-kit/platform_grass.glb
          test -f assets/world-kit/kenney/nature-kit/cliff_large_rock.glb
          test -f assets/world-kit/kenney/nature-kit/cliff_cornerLarge_rock.glb
          test -f assets/world-kit/kenney/nature-kit/cliff_steps_rock.glb
          test -f assets/world-kit/kenney/nature-kit/cliff_waterfallTop_rock.glb
          test -f assets/world-kit/kenney/nature-kit/bridge_stone.glb
          test -f assets/world-kit/kenney/nature-kit/tree_default.glb
          test -f assets/world-kit/kenney/nature-kit/tree_oak.glb
          test -f assets/world-kit/kenney/nature-kit/rock_largeA.glb
          grep -q "version: '18-0B.2'" src/pass18/world-language.js
          grep -q "ACESFilmicToneMapping" src/pass18/world-language.js
          grep -q "pixelRatioMobileMax: 1.25" src/pass18/world-language.js
          grep -q "pixelRatioDesktopMax: 1.5" src/pass18/world-language.js
          grep -q "giant block backdrops are rejected" src/pass18/calibration.js

      - name: Browser dependency
        run: pip install selenium

      - name: Start local static server
        run: |
          python -m http.server 8000 >/tmp/pass18-0b-http.log 2>&1 &
          sleep 2

      - name: Desktop matched look proof
        run: timeout 150s python -u scripts/test_pass18_0b_look.py --target desktop

      - name: Android landscape matched look proof
        run: timeout 150s python -u scripts/test_pass18_0b_look.py --target android

      - name: Upload matched screenshots and metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pass18-0b-look-proof
          path: artifacts/pass18-0b-look-proof
          if-no-files-found: warn
          retention-days: 21
