name: Patch Pass 12 Mobile Boot

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/patch_pass12_mobile_boot.py'
      - '.github/workflows/patch-pass12-mobile-boot.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply mobile fast-start patch
        run: python3 scripts/patch_pass12_mobile_boot.py
      - name: Validate JavaScript
        run: node --check pass12-v1/app.js
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pass12-v1
          if git diff --cached --quiet; then
            echo 'No mobile boot changes.'
          else
            git commit -m 'Speed up Pass 12 mobile startup'
            git push origin HEAD:main
          fi
