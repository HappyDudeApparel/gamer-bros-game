name: Gamer Bros Pass 2 smoke

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'title-v2.js'
      - 'pass2-v1/**'
      - 'playground-v2/gamer-bro.js'
      - '.github/workflows/live-recovery-smoke.yml'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax checks
        run: |
          node --check title-v2.js
          node --check pass2-v1/app.js
      - name: Install Playwright Chromium
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Title, characters, movement and powers
        run: |
          python3 -m http.server 8080 >/tmp/server.log 2>&1 &
          sleep 2
          node <<'NODE'
          const { chromium }=require('playwright');
          const wait=(page,fn,timeout=60000,arg=null)=>page.waitForFunction(fn,arg,{timeout});
          async function run(browser,viewport,isMobile=false){
            const page=await browser.newPage({viewport,hasTouch:isMobile,isMobile,userAgent:isMobile?'Mozilla/5.0 (Linux; Android 15; Pixel 8) AppleWebKit/537.36 Chrome/140 Mobile Safari/537.36':undefined});
            const errors=[];page.on('pageerror',e=>errors.push(String(e)));page.on('console',m=>{if(m.type()==='error')errors.push(m.text())});
            await page.goto('http://127.0.0.1:8080/?smoke=pass2v5',{waitUntil:'domcontentloaded',timeout:60000});
            await page.waitForSelector('#characterRail .charBtn',{state:'visible',timeout:30000});
            await wait(page,()=>document.querySelectorAll('#characterRail .charBtn').length===7,30000);
            await wait(page,()=>window.__titleCharacterReady==='gb2'&&(window.__titleVisibleMeshCount||0)>0,60000);
            await page.click('[data-id="citrus"]');await wait(page,()=>window.__titleCharacterReady==='citrus',30000);
            await page.click('[data-id="ghost"]');await wait(page,()=>window.__titleCharacterReady==='ghost',30000);
            await page.click('[data-id="gb2"]');await wait(page,()=>window.__titleCharacterReady==='gb2'&&(window.__titleVisibleMeshCount||0)>0,30000);
            await page.click('#playBtn');
            await page.waitForURL(/pass2-v1\/\?hero=gb2/,20000);
            await wait(page,()=>window.__pass2Ready===true&&window.__characterReady==='gb2'&&(window.__characterMeshCount||0)>0&&(window.__frameCount||0)>2,60000);
            await wait(page,()=>document.getElementById('boot')?.classList.contains('hide'),10000);
            const z0=await page.evaluate(()=>window.__playerPosition.z);
            await page.keyboard.down('w');await page.waitForTimeout(700);await page.keyboard.up('w');
            await wait(page,z=>window.__playerPosition.z<z-.7,5000,z0);
            if(isMobile){
              const box=await page.locator('#pad').boundingBox(),x=box.x+box.width/2,y=box.y+box.height/2-34;
              const z1=await page.evaluate(()=>window.__playerPosition.z);
              await page.evaluate(({x,y})=>{const el=document.getElementById('pad'),t=new Touch({identifier:77,target:el,clientX:x,clientY:y});el.dispatchEvent(new TouchEvent('touchstart',{touches:[t],targetTouches:[t],changedTouches:[t],bubbles:true,cancelable:true}));},{x,y});
              await page.waitForTimeout(650);
              await page.evaluate(()=>{const el=document.getElementById('pad');el.dispatchEvent(new TouchEvent('touchend',{touches:[],targetTouches:[],changedTouches:[],bubbles:true,cancelable:true}));});
              await wait(page,z=>window.__playerPosition.z<z-.5,5000,z1);
            }
            await page.click('#mode');await wait(page,()=>document.querySelector('#mode strong')?.textContent==='STAR',5000);
            await page.click('#action');
            if((await page.evaluate(()=>window.__powerCount||0))<1)throw new Error('Power test did not fire');
            if(errors.length)throw new Error(errors.join(' | '));
            await page.close();
          }
          (async()=>{const browser=await chromium.launch({headless:true,args:['--enable-unsafe-swiftshader']});await run(browser,{width:1440,height:900});await run(browser,{width:390,height:844},true);await browser.close();console.log('Gamer Bros Pass 2 v5 passed');})().catch(e=>{console.error(e);process.exit(1)});
          NODE
