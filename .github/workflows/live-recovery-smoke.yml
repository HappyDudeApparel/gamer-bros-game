name: Gamer Bros Nature Adventure 4.3 smoke

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'title-v2.js'
      - 'pass4-v2/**'
      - 'playground-v2/gamer-bro.js'
      - '.github/workflows/live-recovery-smoke.yml'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax checks
        run: |
          node --check title-v2.js
          node --check pass4-v2/app.js
          node --check pass4-v2/raycast-cache.js
          node --check pass4-v2/portal-bridge.js
      - name: Install Playwright Chromium
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Nature gameplay and prewarmed Crystal Gate
        run: |
          python3 -m http.server 8080 >/tmp/server.log 2>&1 &
          sleep 2
          node <<'NODE'
          const {chromium}=require('playwright');
          const wait=(p,fn,t=60000,arg=null)=>p.waitForFunction(fn,arg,{timeout:t});
          const dist=(a,b)=>Math.hypot(a.x-b.x,a.z-b.z);
          async function holdInput(page,isMobile){
            const start=await page.evaluate(()=>({...window.__playerPosition}));
            if(isMobile){
              const b=await page.locator('#pad').boundingBox(),x=b.x+b.width/2,y=b.y+b.height/2-38;
              await page.evaluate(({x,y})=>{const el=document.getElementById('pad'),t=new Touch({identifier:9,target:el,clientX:x,clientY:y});el.dispatchEvent(new TouchEvent('touchstart',{touches:[t],targetTouches:[t],changedTouches:[t],bubbles:true,cancelable:true}));},{x,y});
              await wait(page,()=>window.__moveDebug?.mag>.45,12000);
              await page.waitForTimeout(650);
              await page.evaluate(()=>{const el=document.getElementById('pad');el.dispatchEvent(new TouchEvent('touchend',{touches:[],targetTouches:[],changedTouches:[],bubbles:true,cancelable:true}));});
            }else{
              await page.keyboard.down('w');
              await wait(page,()=>window.__moveDebug?.mag>.45,12000);
              await page.waitForTimeout(650);
              await page.keyboard.up('w');
            }
            const end=await page.evaluate(()=>({...window.__playerPosition}));
            if(dist(start,end)<.004)throw new Error('Input registered but player never advanced');
          }
          async function run(browser,viewport,isMobile){
            const page=await browser.newPage({viewport,hasTouch:isMobile,isMobile,userAgent:isMobile?'Mozilla/5.0 (Linux; Android 15; Pixel 8) AppleWebKit/537.36 Chrome/140 Mobile Safari/537.36':undefined});
            const errors=[];page.on('pageerror',e=>errors.push(String(e)));page.on('console',m=>{if(m.type()==='error'&&!m.text().includes('favicon'))errors.push(m.text())});
            await page.goto('http://127.0.0.1:8080/pass4-v2/?hero=gb2&smoke=43',{waitUntil:'domcontentloaded',timeout:60000});
            await wait(page,()=>window.__pass42Ready===true&&window.__continuousGround===true&&window.__characterReady==='gb2'&&(window.__frameCount||0)>2,90000);
            await wait(page,()=>document.getElementById('boot')?.classList.contains('hide'),10000);
            await wait(page,()=>window.__naturePortalReady===true&&window.__naturePortalPrepared===true,30000);
            const sys=await page.evaluate(()=>({terrain:window.__terrainSource,crates:window.__crateCount,enemies:window.__enemyCount,bits:window.__starBitSeed,portal:window.__naturePortalPosition,arch:window.__naturePortalArch}));
            if(!['roboblast','fallback'].includes(sys.terrain)||sys.bits<8||!sys.portal)throw new Error('Nature systems incomplete '+JSON.stringify(sys));
            await holdInput(page,isMobile);
            const y0=await page.evaluate(()=>window.__playerPosition.y);await page.keyboard.press('Space');await page.waitForTimeout(180);if((await page.evaluate(()=>window.__playerPosition.y))<=y0+.08)throw new Error('Jump failed');
            await page.click('#action');await page.waitForTimeout(120);if((await page.evaluate(()=>window.__powerCount||0))<1)throw new Error('Star power failed');
            await wait(page,()=>window.__naturePortalPrewarmed===true,60000);
            await page.evaluate(()=>{const p=window.__naturePortalPosition;window.__playerPosition.x=p.x;window.__playerPosition.z=p.z;window.__playerPosition.y=p.y+.03;});
            await wait(page,()=>['charge','convert','dissipate','afterglow','transfer'].includes(window.__naturePortalState),12000);
            await wait(page,()=>['convert','dissipate','afterglow','transfer'].includes(window.__naturePortalState),12000);
            if(errors.length)throw new Error(errors.join(' | '));
            await page.close();
          }
          (async()=>{const browser=await chromium.launch({headless:true,args:['--enable-unsafe-swiftshader']});await run(browser,{width:1440,height:900},false);await run(browser,{width:390,height:844},true);await browser.close();console.log('Nature Adventure 4.3 + Crystal Gate passed');})().catch(e=>{console.error(e);process.exit(1)});
          NODE
