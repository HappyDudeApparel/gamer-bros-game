name: Validate Pass 17C-3 Camera Proof

on:
  push:
    branches: [pass17-concept-match]
    paths:
      - 'scripts/test_pass17c3_camera_light.py'
      - '.github/workflows/validate-pass17c3-camera-proof.yml'
  workflow_dispatch:

concurrency:
  group: pass17c3-camera-${{ github.ref }}
  cancel-in-progress: true

jobs:
  camera-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild lightweight camera proof candidate
        run: |
          python scripts/build_pass17a.py
          python scripts/fix_pass17a_bridge.py
          python scripts/fix_pass17a_clover.py
          python scripts/build_pass17b.py
          python scripts/patch_pass17_concept_hero.py
          python scripts/patch_pass17_camera.py
          python scripts/patch_pass17_meadow.py
          python scripts/patch_pass17c.py
          python scripts/patch_pass17c3_ci.py
          node --check pass17-world1/app.js
          grep -q "c3visual" pass17-world1/app.js
          grep -q "CAMERA_ZOOMS=\[12.8,16.2,20.0\]" pass17-world1/app.js
      - name: Browser dependency
        run: pip install selenium
      - name: Start local game server
        run: |
          python -m http.server 8000 >/tmp/pass17c3-camera-http.log 2>&1 &
          sleep 2
      - name: Desktop camera proof
        run: timeout 70s python -u scripts/test_pass17c3_camera_light.py --target desktop
      - name: Android camera proof
        run: timeout 70s python -u scripts/test_pass17c3_camera_light.py --target android
      - name: Upload camera proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pass17c3-camera-proof
          path: artifacts/pass17c3-camera-proof
          if-no-files-found: warn
          retention-days: 14
