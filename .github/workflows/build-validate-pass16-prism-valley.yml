name: Build + Validate Pass 16 Prism Valley
on:
  push:
    branches: [main]
    paths:
      - 'scripts/build_pass16_prism_valley.py'
      - 'scripts/fix_pass16_runtime.py'
      - 'scripts/author_pass16_world_v2.py'
      - 'scripts/refine_pass16_routes.py'
      - 'scripts/test_pass16_browser.py'
      - '.github/workflows/build-validate-pass16-prism-valley.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build Pass 16
        run: |
          python scripts/build_pass16_prism_valley.py
          python scripts/fix_pass16_runtime.py
          python scripts/author_pass16_world_v2.py
          python scripts/refine_pass16_routes.py
      - name: Validate JavaScript
        run: |
          node --check pass16-world1/app.js
          node --check pass16-world1/world.js
          node --check pass16-world1/assets.js
          node --check pass16-world1/enemies.js
          node --check pass16-world1/power.js
      - name: Validate production markers
        run: |
          grep -q "pass16-prism-valley" pass16-world1/world.js
          grep -q "window.__pass16Ready" pass16-world1/app.js
          grep -q "groundHits" pass16-world1/world.js
          grep -q "ZOOM 1/3" pass16-world1/index.html
          grep -q "PRISM VALLEY" pass16-world1/app.js
      - name: Browser dependencies
        run: pip install selenium
      - name: Real desktop and Android smoke
        run: |
          python -m http.server 8000 >/tmp/pass16-http.log 2>&1 &
          sleep 2
          python scripts/test_pass16_browser.py
      - name: Commit generated Pass 16
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pass16-world1
          if git diff --cached --quiet; then
            echo 'No generated changes'
          else
            git commit -m 'Build Pass 16 Prism Valley'
            git push
          fi
