name: Sprite Training Grounds smoke

on:
  push:
    branches: [playground-v2]
    paths:
      - 'playground-v2/**'
      - '.github/workflows/playground-v2-smoke.yml'

permissions:
  contents: write

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: playground-v2
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Pin recovered visuals and canonical Gamer Bro
        run: |
          node <<'NODE'
          const fs=require('fs');
          const src=fs.readFileSync('hybrid-v09/src/game.js','utf8');
          const marker='function createGamerBro(THREE, renderer, options)';
          const start=src.indexOf(marker); if(start<0) throw new Error('createGamerBro missing');
          const open=src.indexOf('{',start); let depth=0,end=-1,mode='code',esc=false;
          for(let i=open;i<src.length;i++){
            const c=src[i],n=src[i+1];
            if(mode==='line'){if(c==='\n')mode='code';continue;}
            if(mode==='block'){if(c==='*'&&n==='/'){mode='code';i++;}continue;}
            if(mode==='single'||mode==='double'||mode==='template'){
              if(esc){esc=false;continue;} if(c==='\\'){esc=true;continue;}
              if((mode==='single'&&c==="'")||(mode==='double'&&c==='"')||(mode==='template'&&c==='`'))mode='code';continue;
            }
            if(c==='/'&&n==='/'){mode='line';i++;continue;} if(c==='/'&&n==='*'){mode='block';i++;continue;}
            if(c==="'"){mode='single';continue;} if(c==='"'){mode='double';continue;} if(c==='`'){mode='template';continue;}
            if(c==='{')depth++; else if(c==='}'&&--depth===0){end=i+1;break;}
          }
          if(end<0) throw new Error('createGamerBro end missing');
          fs.writeFileSync('playground-v2/gamer-bro.js',src.slice(start,end)+'\n\nexport { createGamerBro };\n');

          const p='playground-v2/main.js';
          let game=fs.readFileSync(p,'utf8');
          game=game.replace("const grassMat=new THREE.MeshStandardMaterial({color:0x72bc58,roughness:.82,metalness:0});","const grassMat=new THREE.MeshStandardMaterial({color:0x72bc58,roughness:.82,metalness:0,side:THREE.DoubleSide});");
          game=game.replace("const grassLight=new THREE.MeshStandardMaterial({color:0x88cf69,roughness:.82});","const grassLight=new THREE.MeshStandardMaterial({color:0x88cf69,roughness:.82,side:THREE.DoubleSide});");
          game=game.replace('topGeo.rotateX(-Math.PI/2);','topGeo.rotateX(Math.PI/2);');
          game=game.replace('debris(hitPos||b.mesh.position,0xa96f35,7);','debris(hitPos||b.mesh.position,0xa96f35,3);');
          fs.writeFileSync(p,game);
          NODE
          node --check playground-v2/gamer-bro.js
          node --check playground-v2/main.js
      - name: Commit pinned/refined game files if needed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add playground-v2/gamer-bro.js playground-v2/main.js
          if ! git diff --cached --quiet; then
            git commit -m 'Refine recovered Training Grounds visual alignment'
            git push origin HEAD:playground-v2
          fi
      - name: Install Playwright Chromium
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Browser gameplay smoke
        run: |
          python3 -m http.server 8080 >/tmp/server.log 2>&1 &
          sleep 2
          node <<'NODE'
          const { chromium }=require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport:{width:1440,height:900}});
            const errors=[]; page.on('pageerror',e=>errors.push(String(e)));
            await page.goto('http://127.0.0.1:8080/playground-v2/',{waitUntil:'domcontentloaded',timeout:45000});
            await page.waitForSelector('#characterGrid .characterCard',{timeout:45000});
            if(await page.locator('#characterGrid .characterCard').count()!==5) throw new Error('Expected five playable characters');
            await page.click('[data-character="gamer"]');
            await page.waitForSelector('canvas',{state:'visible',timeout:30000});
            const selectVisible=await page.locator('#select').evaluate(el=>getComputedStyle(el).display!=='none');
            if(selectVisible) throw new Error('Character-select overlay did not close');
            await page.waitForTimeout(1200);
            await page.keyboard.down('w'); await page.waitForTimeout(700); await page.keyboard.up('w');
            await page.keyboard.press('f'); await page.waitForTimeout(250);
            await page.keyboard.press('q'); await page.waitForTimeout(350);
            const fatal=await page.locator('#fatal').evaluate(el=>getComputedStyle(el).display!=='none');
            if(fatal) throw new Error('Fatal startup UI visible');
            if(errors.length) throw new Error(errors.join(' | '));
            await page.screenshot({path:'training-grounds-smoke.png',fullPage:true});
            console.log('Training Grounds browser smoke passed');
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1);});
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: training-grounds-smoke
          path: training-grounds-smoke.png
          if-no-files-found: ignore
