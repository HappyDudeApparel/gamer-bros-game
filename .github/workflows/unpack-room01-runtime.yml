name: Unpack Room 01 runtime

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/unpack-room01-runtime.yml'
      - 'room01-v1/main.js'

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Expand packed Room 01 runtime into normal JavaScript
        run: |
          node <<'NODE'
          const fs=require('fs');
          const zlib=require('zlib');
          const packed=fs.readFileSync('room01-v1/main.js','utf8');
          const m=packed.match(/const payload='([^']+)'/);
          if(!m) throw new Error('Packed Room 01 payload not found');
          let source=zlib.gunzipSync(Buffer.from(m[1],'base64')).toString('utf8');

          // The packed source has used both relative and root-absolute imports.
          // Always rewrite the actual import specifiers so mobile browsers cannot
          // keep an older broken dependency module in their HTTP/module cache.
          source=source
            .replace(/(['"])(?:\.\/|\/room01-v1\/)portal-v2\.js\?v=[^'"]+\1/g,"'/room01-v1/portal-v2.js?v=106'")
            .replace(/(['"])(?:\.\/|\/room01-v1\/)v04-sprites\.js\?v=[^'"]+\1/g,"'/room01-v1/v04-sprites.js?v=106'")
            .replace(/(['"])\/playground-v2\/gamer-bro\.js\?v=[^'"]+\1/g,"'/playground-v2/gamer-bro.js?v=106'");

          fs.writeFileSync('room01-v1/runtime.js',source);
          const indexPath='room01-v1/index.html';
          let html=fs.readFileSync(indexPath,'utf8');
          html=html
            .replace(/<script type="module" src="\.\/(?:launcher|runtime)\.js\?v=[^"]+"><\/script>/,'<script type="module" src="./runtime.js?v=106"></script>')
            .replace(/styles\.css\?v=[^"']+/,'styles.css?v=106');
          fs.writeFileSync(indexPath,html);
          NODE
      - name: Verify rewritten imports
        run: |
          grep -F "/playground-v2/gamer-bro.js?v=106" room01-v1/runtime.js
          grep -F "/room01-v1/portal-v2.js?v=106" room01-v1/runtime.js
          grep -F "/room01-v1/v04-sprites.js?v=106" room01-v1/runtime.js
          grep -F "runtime.js?v=106" room01-v1/index.html
      - name: Syntax checks
        run: |
          node --check room01-v1/runtime.js
          node --check room01-v1/portal-v2.js
          node --check room01-v1/v04-sprites.js
          node --check playground-v2/gamer-bro.js
      - name: Commit normal runtime
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add room01-v1/runtime.js room01-v1/index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Serve Room 01 with fresh dependency modules'
          git push origin HEAD:main