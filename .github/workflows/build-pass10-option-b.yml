name: Build Pass 10 Option B

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-pass10-option-b.yml'
      - 'scripts/build_pass10_option_b.py'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Generate Pass 10
        run: python3 scripts/build_pass10_option_b.py
      - name: Commit Pass 10
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pass10-v1
          if git diff --cached --quiet; then
            echo 'No Pass 10 changes.'
          else
            git commit -m 'Build Pass 10 Option B asset-dressed World 1'
            git push origin HEAD:main
          fi
