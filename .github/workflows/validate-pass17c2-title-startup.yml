name: Validate Pass 17C-2 Title + Startup

on:
  push:
    branches: [pass17-concept-match]
    paths:
      - 'scripts/test_pass17c2_title_startup.py'
      - '.github/workflows/validate-pass17c2-title-startup.yml'
      - 'index.html'
      - 'title-v5.js'
      - 'scripts/patch_pass17_concept_hero.py'
      - 'scripts/patch_pass17_camera.py'
      - 'scripts/patch_pass17_meadow.py'
      - 'scripts/patch_pass17c.py'
      - 'src/pass17-concept-hero.js'
      - 'src/pass17-gamer-bro.js'
  workflow_dispatch:

concurrency:
  group: pass17c2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checkpoint:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - name: Rebuild deterministic Pass 17 foundation
        run: |
          python scripts/build_pass17a.py
          python scripts/fix_pass17a_bridge.py
          python scripts/fix_pass17a_clover.py
          python scripts/build_pass17b.py
          python scripts/patch_pass17_concept_hero.py
          python scripts/patch_pass17_camera.py
          python scripts/patch_pass17_meadow.py
          python scripts/patch_pass17c.py

      - name: Static title and startup sanity
        run: |
          node --check title-v5.js
          node --check pass17-world1/app.js
          node --check src/pass17-concept-hero.js
          grep -q "window.__pass17TitleReady=true" title-v5.js
          grep -q "window.__playableRoster=\['gb1','gb2'\]" title-v5.js
          grep -q "__pass17StartupMs" pass17-world1/app.js
          grep -q "__pass17Ready=true" pass17-world1/app.js
          grep -q "version:'17-hero-2'" src/pass17-concept-hero.js

      - name: Browser dependency
        run: pip install selenium

      - name: Android portrait landscape and title-to-game startup gate
        run: |
          python -m http.server 8000 >/tmp/pass17c2-http.log 2>&1 &
          sleep 2
          python -u scripts/test_pass17c2_title_startup.py

      - name: Upload Pass 17C-2 proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pass17c2-title-startup-proof
          path: artifacts/pass17c2-proof
          if-no-files-found: warn
          retention-days: 14
