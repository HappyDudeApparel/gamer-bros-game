name: Enhance Pass 12 Rewards

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/enhance_pass12_rewards.py'
      - '.github/workflows/enhance-pass12-rewards.yml'

permissions:
  contents: write

jobs:
  enhance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wire exploration rewards
        run: python3 scripts/enhance_pass12_rewards.py
      - name: Validate JavaScript
        run: node --check pass12-v1/app.js
      - name: Commit reward layer
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pass12-v1
          if git diff --cached --quiet; then
            echo 'No reward changes.'
          else
            git commit -m 'Enhance Pass 12 exploration rewards'
            git push origin HEAD:main
          fi
