name: Import reusable world assets

on:
  workflow_dispatch:
  push:
    branches: [pass18-rebuild]
    paths:
      - '.github/workflows/import-world-assets.yml'

permissions:
  contents: write

concurrency:
  group: world-assets-${{ github.ref }}
  cancel-in-progress: true

jobs:
  import-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout game repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Import approved reusable asset sources
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE/assets/world-kit"
          TMP="$RUNNER_TEMP/world-assets"
          rm -rf "$TMP"
          mkdir -p "$TMP" "$ROOT"

          copy_browser_assets() {
            src="$1"; dst="$2"
            mkdir -p "$dst"
            while IFS= read -r -d '' f; do
              rel="${f#$src/}"
              mkdir -p "$dst/$(dirname "$rel")"
              cp "$f" "$dst/$rel"
            done < <(find "$src" -type f \( \
              -iname '*.glb' -o -iname '*.gltf' -o -iname '*.bin' -o \
              -iname '*.png' -o -iname '*.jpg' -o -iname '*.jpeg' -o -iname '*.webp' -o \
              -iname '*.ogg' -o -iname '*.wav' -o -iname '*.mp3' \
            \) -print0)
          }

          echo '--- Existing permanent reusable sources ---'
          git clone --depth 1 https://github.com/KenneyNL/Starter-Kit-City-Builder.git "$TMP/kenney-city"
          copy_browser_assets "$TMP/kenney-city/models" "$ROOT/kenney/city-builder/models"
          cp "$TMP/kenney-city/LICENSE.md" "$ROOT/kenney/city-builder/LICENSE.md" || true
          cp "$TMP/kenney-city/README.md" "$ROOT/kenney/city-builder/README.md" || true

          git clone --depth 1 https://github.com/KenneyNL/Starter-Kit-Basic-Scene.git "$TMP/kenney-basic"
          copy_browser_assets "$TMP/kenney-basic" "$ROOT/kenney/basic-scene"
          cp "$TMP/kenney-basic/LICENSE.md" "$ROOT/kenney/basic-scene/LICENSE.md" || true
          cp "$TMP/kenney-basic/README.md" "$ROOT/kenney/basic-scene/README.md" || true

          git clone --depth 1 https://github.com/KayKit-Game-Assets/KayKit-City-Builder-Bits-1.0.git "$TMP/kay-city"
          copy_browser_assets "$TMP/kay-city" "$ROOT/kaykit/city-builder-bits"
          cp "$TMP/kay-city/LICENSE" "$ROOT/kaykit/city-builder-bits/LICENSE" 2>/dev/null || true
          cp "$TMP/kay-city/LICENSE.txt" "$ROOT/kaykit/city-builder-bits/LICENSE.txt" 2>/dev/null || true

          git clone --depth 1 https://github.com/KayKit-Game-Assets/KayKit-Medieval-Hexagon-Pack-1.0.git "$TMP/kay-medieval"
          copy_browser_assets "$TMP/kay-medieval" "$ROOT/kaykit/medieval-hexagon"
          cp "$TMP/kay-medieval/LICENSE" "$ROOT/kaykit/medieval-hexagon/LICENSE" 2>/dev/null || true
          cp "$TMP/kay-medieval/LICENSE.txt" "$ROOT/kaykit/medieval-hexagon/LICENSE.txt" 2>/dev/null || true

          git clone --depth 1 https://github.com/KayKit-Game-Assets/KayKit-Dungeon-Remastered-1.0.git "$TMP/kay-dungeon"
          copy_browser_assets "$TMP/kay-dungeon" "$ROOT/kaykit/dungeon-remastered"
          cp "$TMP/kay-dungeon/LICENSE" "$ROOT/kaykit/dungeon-remastered/LICENSE" 2>/dev/null || true
          cp "$TMP/kay-dungeon/LICENSE.txt" "$ROOT/kaykit/dungeon-remastered/LICENSE.txt" 2>/dev/null || true

          # Kenney's asset pages no longer expose stable ZIP links in page HTML. For CI delivery,
          # use the public CC0 all-in-one mirror verified during the Pass 18 audit, while keeping
          # Kenney's official asset pages as the canonical source/license references in SOURCES.md.
          echo '--- Pass 18 Kenney concept-match kits via verified CC0 mirror ---'
          git clone --depth 1 --filter=blob:none --sparse https://github.com/shorepine/kenney.git "$TMP/kenney-mirror"
          git -C "$TMP/kenney-mirror" sparse-checkout set 3d/nature 3d/fantasy-town 3d/castle

          copy_browser_assets "$TMP/kenney-mirror/3d/nature" "$ROOT/kenney/nature-kit"
          copy_browser_assets "$TMP/kenney-mirror/3d/fantasy-town" "$ROOT/kenney/fantasy-town-kit"
          copy_browser_assets "$TMP/kenney-mirror/3d/castle" "$ROOT/kenney/castle-kit"
          cp "$TMP/kenney-mirror/LICENSE.txt" "$ROOT/kenney/nature-kit/LICENSE.txt" || true
          cp "$TMP/kenney-mirror/LICENSE.txt" "$ROOT/kenney/fantasy-town-kit/LICENSE.txt" || true
          cp "$TMP/kenney-mirror/LICENSE.txt" "$ROOT/kenney/castle-kit/LICENSE.txt" || true

          # Preserve the already-vendored Kenney Platformer and KayKit Platformer packs. Their
          # official download endpoints are not stable enough for every CI run, so 18-0A verifies
          # the committed copies instead of silently replacing or deleting them.
          test -d "$ROOT/kenney/platformer-kit"
          test -d "$ROOT/kaykit/platformer-pack"

          cat > "$ROOT/SOURCES.md" <<'EOF'
          # Gamer Bros reusable world asset library

          This directory is the permanent reusable environment/model pool for Gamer Bros worlds and levels.

          ## Approved sources

          - Kenney Platformer Kit — https://kenney.nl/assets/platformer-kit — CC0. Previously vendored and retained.
          - Kenney Nature Kit — https://kenney.nl/assets/nature-kit — CC0. Pass 18 primary terrain/nature/bridge/fence kit. CI delivery mirror: https://github.com/shorepine/kenney/tree/main/3d/nature
          - Kenney Fantasy Town Kit — https://kenney.nl/assets/fantasy-town-kit — CC0. Pass 18 ruins/woodwork/Riverworks support. CI delivery mirror: https://github.com/shorepine/kenney/tree/main/3d/fantasy-town
          - Kenney Castle Kit — https://kenney.nl/assets/castle-kit — CC0. Pass 18 ceremonial/bridge-gate/Prism Ridge support. CI delivery mirror: https://github.com/shorepine/kenney/tree/main/3d/castle
          - Kenney Starter Kit City Builder — https://github.com/KenneyNL/Starter-Kit-City-Builder — code MIT; included assets CC0.
          - Kenney Starter Kit Basic Scene — https://github.com/KenneyNL/Starter-Kit-Basic-Scene — support/reference scene assets.
          - KayKit Platformer Pack FREE — https://kaylousberg.itch.io/kaykit-platformer — CC0. Previously vendored and retained.
          - KayKit City Builder Bits — https://github.com/KayKit-Game-Assets/KayKit-City-Builder-Bits-1.0 — CC0.
          - KayKit Medieval Hexagon Pack — https://github.com/KayKit-Game-Assets/KayKit-Medieval-Hexagon-Pack-1.0 — CC0.
          - KayKit Dungeon Remastered — https://github.com/KayKit-Game-Assets/KayKit-Dungeon-Remastered-1.0 — CC0.

          The `shorepine/kenney` mirror is used only as a reproducible CI delivery path for the three Pass 18 Kenney packs. Kenney's official pages remain the canonical source/license references.

          Only browser-useful runtime files are vendored here. Godot import caches/editor metadata are intentionally excluded.

          Pass 18 rules:
          - Real kit assets are searched before custom geometry is authored.
          - World content is composed from real modular terrain/structure assets plus narrowly justified custom shaders/geometry.
          - Do not revert to a single smooth heightfield as the visible Prism Valley terrain.
          - Main remains untouched until Pass 18 visual and performance gates are approved.
          EOF

          cat > "$ROOT/catalog.json" <<'EOF'
          {
            "version": 3,
            "purpose": "Reusable Gamer Bros world/level asset pool",
            "sources": [
              {"id":"kenney-platformer","role":"terrain/traversal","preferred":true},
              {"id":"kenney-nature","role":"cliffs/nature/bridges/fences/river-path vocabulary","preferred":true},
              {"id":"kenney-fantasy-town","role":"ruins/woodwork/riverworks structures","preferred":true},
              {"id":"kenney-castle","role":"ceremonial/bridge gates/prism ridge structures","preferred":true},
              {"id":"kenney-city-builder","role":"settlements/buildings","preferred":false},
              {"id":"kenney-basic-scene","role":"ruin/support vocabulary","preferred":true},
              {"id":"kaykit-platformer","role":"pipes/platformer dressing/gameplay props","preferred":true},
              {"id":"kaykit-city-builder-bits","role":"settlement props/buildings","preferred":false},
              {"id":"kaykit-medieval-hexagon","role":"nature/river/far ridge/medieval props","preferred":true},
              {"id":"kaykit-dungeon-remastered","role":"ruins/interiors/stone props","preferred":true}
            ]
          }
          EOF

          find "$ROOT" -type d -empty -delete || true
          echo "Imported file count: $(find "$ROOT" -type f | wc -l)"
          du -sh "$ROOT" || true

          # 18-0A hard evidence: every required foundation pack contains usable 3D files.
          for required in \
            "$ROOT/kenney/nature-kit" \
            "$ROOT/kenney/fantasy-town-kit" \
            "$ROOT/kenney/castle-kit" \
            "$ROOT/kenney/platformer-kit" \
            "$ROOT/kaykit/platformer-pack" \
            "$ROOT/kaykit/medieval-hexagon" \
            "$ROOT/kaykit/dungeon-remastered"; do
            count=$(find "$required" -type f \( -iname '*.glb' -o -iname '*.gltf' \) | wc -l)
            echo "$required: $count 3D files"
            test "$count" -gt 0
          done

          # Spot-check concept-critical assets so a wrong upstream directory cannot pass merely
          # because it contains unrelated GLBs.
          test -f "$ROOT/kenney/nature-kit/bridge_stone.glb"
          test -f "$ROOT/kenney/nature-kit/cliff_waterfall_rock.glb"
          test -f "$ROOT/kenney/fantasy-town-kit/wall-arch.glb"
          test -f "$ROOT/kenney/castle-kit/bridge-straight-pillar.glb"

      - name: Commit imported asset library to the active branch only
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/world-kit
          if git diff --cached --quiet; then
            echo 'No asset changes to commit.'
          else
            git commit -m 'Pass 18-0A: import approved concept-match asset kits'
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
