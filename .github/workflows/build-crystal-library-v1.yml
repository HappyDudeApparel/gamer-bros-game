name: Build Crystal Library v1

on:
  push:
    branches: [crystal-library-v1-build]
    paths:
      - tools/build-crystal-library-v1.mjs
      - tools/run-crystal-library-v1.mjs
      - .github/workflows/build-crystal-library-v1.yml

permissions:
  contents: write

jobs:
  build-and-smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: crystal-library-v1-build
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build arena into clean source
        run: node tools/run-crystal-library-v1.mjs
      - name: Syntax and architecture checks
        run: |
          node --check hybrid-v09/src/game.js
          grep -q 'CRYSTAL_LIBRARY_V1' hybrid-v09/src/game.js
          ! grep -q 'terrainTex90(' hybrid-v09/src/game.js
          ! grep -q '    bakeEnvironment();' hybrid-v09/src/game.js
          ! grep -q 'arena.layout.json' hybrid-v09/src/game.js
      - name: Browser startup smoke test
        run: |
          python3 -m http.server 8000 >/tmp/crystal-library-server.log 2>&1 &
          sleep 2
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$CHROME" ]; then
            echo 'No Chrome binary on runner; static checks passed but browser smoke test unavailable.'
            exit 0
          fi
          timeout 45s "$CHROME" --headless=new --no-sandbox --disable-dev-shm-usage --disable-gpu --virtual-time-budget=12000 --dump-dom http://127.0.0.1:8000/hybrid-v09/ >/tmp/crystal-library-dom.html
          grep -q 'id="boot" class="hidden"' /tmp/crystal-library-dom.html
          grep -q 'id="ui" class="show"' /tmp/crystal-library-dom.html
          ! grep -q 'id="fatal" style="display: grid' /tmp/crystal-library-dom.html
      - name: Remove one-time build helpers
        run: rm -f tools/build-crystal-library-v1.mjs tools/run-crystal-library-v1.mjs .github/workflows/build-crystal-library-v1.yml
      - name: Commit validated build
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Build validated Crystal Library v1 arena"
          git push origin HEAD:crystal-library-v1-build
