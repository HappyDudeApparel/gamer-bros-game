name: Build + Validate Pass 17C Production Gate

on:
  push:
    branches: [pass17-concept-match]
    paths:
      - 'scripts/patch_pass17c.py'
      - 'scripts/patch_pass17c3_ci.py'
      - 'scripts/patch_pass17c4_combat.py'
      - 'scripts/patch_pass17c5_portal.py'
      - 'scripts/test_pass17c2_title_startup.py'
      - 'scripts/test_pass17c3_world_camera.py'
      - 'scripts/test_pass17c3_camera_light.py'
      - 'scripts/test_pass17c4_combat.py'
      - 'scripts/test_pass17c5_portal.py'
      - '.github/workflows/build-validate-pass17c.yml'
      - 'scripts/build_pass17a.py'
      - 'scripts/fix_pass17a_bridge.py'
      - 'scripts/fix_pass17a_clover.py'
      - 'scripts/build_pass17b.py'
      - 'scripts/patch_pass17_concept_hero.py'
      - 'scripts/patch_pass17_camera.py'
      - 'scripts/patch_pass17_meadow.py'
      - 'src/pass17-riverworks-kit.js'
      - 'src/pass17-enemies.js'
      - 'src/pass17-asset-library.js'
      - 'src/pass17-concept-hero.js'
      - 'src/pass17-gamer-bro.js'
      - 'src/crystal-library-tube-v2.js'
      - 'pass16-world1/power.js'
      - 'index.html'
      - 'title-v5.js'
  workflow_dispatch:

concurrency:
  group: pass17c-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild locked Pass 17 production candidate
        run: |
          python scripts/build_pass17a.py
          python scripts/fix_pass17a_bridge.py
          python scripts/fix_pass17a_clover.py
          python scripts/build_pass17b.py
          python scripts/patch_pass17_concept_hero.py
          python scripts/patch_pass17_camera.py
          python scripts/patch_pass17_meadow.py
          python scripts/patch_pass17c.py
          python scripts/patch_pass17c3_ci.py
          python scripts/patch_pass17c4_combat.py
          python scripts/patch_pass17c5_portal.py

      - name: Validate JavaScript and locked production markers
        run: |
          node --check pass17-world1/app.js
          node --check pass17-world1/world.js
          node --check pass17-world1/assets.js
          node --check pass17-world1/enemies.js
          node --check pass17-world1/power.js
          node --check src/pass17-riverworks-kit.js
          node --check src/pass17-concept-hero.js
          node --check src/pass17-gamer-bro.js
          node --check src/crystal-library-tube-v2.js
          grep -q "__pass17CVersion='17C1'" pass17-world1/app.js
          grep -q "__pass17PortalWatchdog" pass17-world1/app.js
          grep -q "CAMERA_ZOOMS=\[12.8,16.2,20.0\]" pass17-world1/app.js
          grep -q "stageEnemyAttack" pass17-world1/app.js
          grep -q "combatInfo" pass17-world1/app.js
          grep -q "portalColdTrigger" pass17-world1/app.js
          grep -q "portalEnter" pass17-world1/app.js
          grep -q "portalStep" pass17-world1/app.js
          grep -q "impactRings" pass17-world1/power.js
          grep -q "MAX CHARGE" pass17-world1/power.js
          grep -q "portal-meadow-dirt-path" pass17-world1/world.js
          grep -q "riverworks-main-pipe" pass17-world1/world.js
          grep -q "__pass17ConceptLandmarksReady" pass17-world1/world.js
          grep -q "version:'17-hero-2'" src/pass17-concept-hero.js
          grep -q "component:'crystal-library-v2-tube'" src/crystal-library-tube-v2.js

      - name: Browser dependencies
        run: pip install selenium

      - name: Start local game server
        run: |
          python -m http.server 8000 >/tmp/pass17c-http.log 2>&1 &
          sleep 2

      - name: 17C-2 phone title selection and startup
        run: timeout 190s python -u scripts/test_pass17c2_title_startup.py

      - name: 17C-3 desktop production world streaming
        run: timeout 170s python -u scripts/test_pass17c3_world_camera.py --target desktop --mode stream

      - name: 17C-3 Android production world streaming
        run: timeout 170s python -u scripts/test_pass17c3_world_camera.py --target android --mode stream

      - name: 17C-3 desktop camera proof
        run: timeout 130s python -u scripts/test_pass17c3_camera_light.py --target desktop

      - name: 17C-3 Android camera proof
        run: timeout 130s python -u scripts/test_pass17c3_camera_light.py --target android

      - name: 17C-4 desktop combat and Prism Breaker
        run: timeout 140s python -u scripts/test_pass17c4_combat.py --target desktop

      - name: 17C-4 Android combat and Prism Breaker
        run: timeout 140s python -u scripts/test_pass17c4_combat.py --target android

      - name: 17C-5 desktop canonical portal
        run: timeout 150s python -u scripts/test_pass17c5_portal.py --target desktop

      - name: 17C-5 Android canonical portal
        run: timeout 150s python -u scripts/test_pass17c5_portal.py --target android

      - name: Upload Pass 17C production proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pass17c-production-proof
          path: |
            artifacts/pass17c2-proof
            artifacts/pass17c3-proof
            artifacts/pass17c3-camera-proof
            artifacts/pass17c4-combat-proof
            artifacts/pass17c5-portal-proof
          if-no-files-found: warn
          retention-days: 14

      - name: Commit generated Pass 17C only after green gate
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pass17-world1
          if git diff --cached --quiet; then
            echo 'No generated Pass 17C changes'
          else
            git commit -m 'Build Pass 17C production gate'
            git pull --rebase origin pass17-concept-match
            git push origin HEAD:pass17-concept-match
          fi
